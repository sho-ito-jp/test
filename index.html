<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>JS TEST</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 100px;
    }

    button {
      font-size: 24px;
      padding: 15px 30px;
    }
  </style>
</head>

<body>

  <button id="button">押してみて</button>

  <script>
    const button = document.getElementById("button");

    button.addEventListener("click", () => {
      alert("伊藤翔のJSが動いた！");
    });
  </script>

</body>
</html>
